retriever:
  file: "retriever/Umsatzsteuerrichtlinien.pdf"
  headers_to_split_on:
    - ["#", "Header 1"]
    - ["##", "Header 2"]
  load_documents: False # set to true to processs .pdf
  # Databricks Vector Search configuration
  vector_search_endpoint_name: "vat_vector_search"
  vector_index_name: "vat_vector_index"
  vector_dimension: 1536  # OpenAI embedding dimension
  top_k: 3
  top_k_compression: 3
  ensemble_weights: [0.3, 0.3, 0.4]
  rerank_model: rerank-german

# Azure Document Intelligence configuration
document_intelligence:
  endpoint: "DOCUMENT_INTELLIGENCE_ENDPOINT"
  key: "DOCUMENT_INTELLIGENCE_KEY"

# Azure OpenAI configuration
azure_openai:
  api_version: "2023-05-15"
  endpoint: "AZURE_OPENAI_ENDPOINT"
  deployment_name_gpt4: "gpt-4o"
  deployment_name_embeddings: "text-embedding-ada-002"
  temperature: 0

# Databricks configuration
databricks:
  catalog: "vat_catalog"
  schema: "vat_schema" 
