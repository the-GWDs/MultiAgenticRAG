retriever:
  file: "retriever/google-2024-environmental-report.pdf"
  headers_to_split_on:
    - ["#", "Header 1"]
    - ["##", "Header 2"]
  load_documents: False
  # Databricks Vector Search configuration
  vector_search_endpoint_name: "rag_vector_search"
  vector_index_name: "rag_vector_index"
  vector_dimension: 1536  # OpenAI embedding dimension
  top_k: 3
  top_k_compression: 3
  ensemble_weights: [0.3, 0.3, 0.4]
  cohere_rerank_model: rerank-english-v3.0

# Azure Document Intelligence configuration
document_intelligence:
  endpoint: "YOUR_DOCUMENT_INTELLIGENCE_ENDPOINT"
  key: "YOUR_DOCUMENT_INTELLIGENCE_KEY"

# Azure OpenAI configuration
azure_openai:
  api_version: "2023-05-15"
  endpoint: "YOUR_AZURE_OPENAI_ENDPOINT"
  deployment_name_gpt4: "gpt-4o"
  deployment_name_gpt4_mini: "gpt-4o-mini"
  deployment_name_embeddings: "text-embedding-ada-002"
  temperature: 0

# Databricks configuration
databricks:
  workspace_url: "YOUR_DATABRICKS_WORKSPACE_URL"
  catalog: "rag_catalog"
  schema: "rag_schema" 
